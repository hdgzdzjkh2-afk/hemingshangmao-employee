<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>荷茗商贸 · 亚马逊员工档案</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--primary:#4f6ef7;--primary-dark:#3b54d4;--success:#22c55e;--warning:#f59e0b;--danger:#ef4444;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--border:#e2e8f0;--shadow:0 1px 3px rgba(0,0,0,.08);--radius:12px;--male:#3b82f6;--female:#ec4899}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-page.hidden{display:none}
.login-card{background:var(--card);border-radius:20px;padding:48px 40px;width:420px;max-width:100%;box-shadow:0 4px 24px rgba(0,0,0,.1);text-align:center}
.login-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--primary),#818cf8);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;color:#fff;margin-bottom:20px}
.login-card h1{font-size:22px;font-weight:700;margin-bottom:4px}
.login-card .subtitle{font-size:13px;color:var(--text2);margin-bottom:24px}
.login-card label{display:block;font-size:12px;color:var(--text3);margin-bottom:4px;text-align:left}
.login-card input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;margin-bottom:12px;text-align:center}
.login-card input:focus{border-color:var(--primary)}
.login-card button{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s}
.login-card button:hover{background:var(--primary-dark)}
.login-card button:disabled{opacity:.6;cursor:not-allowed}
.app{display:none;min-height:100vh}
.app.active{display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.topbar-left{display:flex;align-items:center;gap:10px}
.logo-sm{width:32px;height:32px;background:linear-gradient(135deg,var(--primary),#818cf8);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
.topbar h1{font-size:16px;font-weight:700}
.topbar-right{display:flex;align-items:center;gap:12px}
.user-name{font-size:13px;font-weight:500}
.stats-row{display:flex;flex-direction:column;gap:12px;padding:20px 24px}
.stat-group{display:grid;gap:12px}
.stat-card{background:var(--card);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;align-items:center;gap:12px;cursor:pointer;transition:transform .15s,box-shadow .15s,outline .15s;outline:2px solid transparent;user-select:none}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.stat-card:active{transform:translateY(0)}
.stat-card.stat-active{outline-color:var(--primary);background:#eef2ff}
.stat-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.stat-num{font-size:22px;font-weight:700;line-height:1.2}
.stat-label{font-size:11px;color:var(--text3)}
.stat-pct{font-size:10px;color:var(--text3);margin-left:4px;opacity:.75;font-weight:400}
.stat-group-title{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--text3)}
.stat-group-title::after{content:'';flex:1;height:1px;background:var(--border)}
.stat-group-title span{white-space:nowrap}
.stat-card.stat-wide{padding:15px 20px}
.stat-wide>div{flex:none}
.stat-wide .stat-meta{margin-left:auto;display:flex;align-items:center;font-size:12px;color:var(--text2)}
.stat-meta>span{padding:0 14px;border-left:1px solid var(--border);white-space:nowrap}
.stat-meta>span:first-child{border-left:none}
.stat-meta b{font-weight:600;color:var(--text);margin-left:3px}
.content{padding:0 24px 24px;flex:1}
.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-box{flex:1;min-width:160px;position:relative}
.search-box input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--card);transition:border-color .2s}
.search-box input:focus{border-color:var(--primary)}
.search-box .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text3)}
select,.btn{padding:9px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);cursor:pointer;outline:none;transition:all .2s;color:var(--text)}
.btn-primary{background:var(--primary);color:#fff;border:none;font-weight:600}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;border-color:var(--primary);color:var(--primary)}
.btn-outline:hover{background:#eef2ff}
.btn-sm{padding:6px 12px;font-size:12px}
.filter-toggle{display:inline-flex;align-items:center;gap:4px}
.filter-count{background:var(--primary);color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;display:none}
.filter-count.active{display:inline-block}
.filter-panel{display:none;background:var(--card);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;box-shadow:var(--shadow)}
.filter-panel.open{display:block}
.filter-row{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.filter-row .fg{min-width:120px}
.filter-row .fg label{font-size:11px;font-weight:600;color:var(--text2);margin-bottom:3px;display:block}
.filter-row .fg select,.filter-row .fg input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;outline:none;background:#fff}
.filter-row .fg select:focus,.filter-row .fg input:focus{border-color:var(--primary)}
.filter-row .filter-range{display:flex;align-items:center;gap:6px}
.filter-row .filter-range span{font-size:12px;color:var(--text3)}
.filter-row .filter-range input{width:80px}
.filter-actions{display:flex;align-items:flex-end;gap:6px}
.filter-actions button{padding:7px 14px;border-radius:6px;font-size:12px}
.filter-result{font-size:12px;color:#15803d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:20px;padding:5px 12px;white-space:nowrap;align-self:center}
.filter-result b{font-weight:600;font-size:13px}
.emp-type-tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.emp-type-tag.regular{background:#dcfce7;color:#16a34a}
.emp-type-tag.probation{background:#fef9c3;color:#ca8a04}
.emp-type-tag.resigned{background:#f1f5f9;color:#64748b}
.emp-type-tag.terminated{background:#fef2f2;color:#ef4444}
.table-wrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.table-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.table-hdr h3{font-size:14px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:#f8fafc}
th{padding:10px 14px;text-align:left;font-weight:600;color:var(--text2);font-size:12px;white-space:nowrap;border-bottom:1px solid var(--border)}
.sortable-th{cursor:pointer;user-select:none;transition:color .15s}
.sortable-th:hover{color:var(--primary)}
.sortable-th .sort-icon{font-size:10px;margin-left:4px;color:var(--text3)}
.sortable-th.active-sort{color:var(--primary)}
.sortable-th.active-sort .sort-icon{color:var(--primary)}
td{padding:12px 14px;border-bottom:1px solid var(--border)}
tbody tr{transition:background .15s;cursor:pointer}
tbody tr:hover{background:#f8fafc}
.gender-tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.gender-tag.male{background:#dbeafe;color:var(--male)}
.gender-tag.female{background:#fce7f3;color:var(--female)}
.text-ellipsis{max-width:160px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.action-btns{display:flex;gap:6px}
.action-btns button{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:4px;font-size:13px;color:var(--text2);transition:all .15s}
.action-btns .edit-btn:hover{color:var(--primary);background:#eef2ff}
.action-btns .del-btn:hover{color:var(--danger);background:#fef2f2}
.table-footer{padding:12px 18px;font-size:12px;color:var(--text3)}
.empty{text-align:center;padding:60px 20px}
.empty .icon{font-size:48px;margin-bottom:12px}
.empty h3{font-size:16px;margin-bottom:6px}
.empty p{font-size:13px;color:var(--text3);margin-bottom:16px}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:center;justify-content:center;padding:20px}
.modal-overlay.active{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.15)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-header h2{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text3);line-height:1}
.modal-body{flex:1;overflow-y:auto;padding:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.form-group{display:flex;flex-direction:column}
.form-group label{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;font-family:inherit;transition:border-color .2s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--primary)}
.form-group textarea{resize:vertical;min-height:60px}
.form-group .req::after{content:' *';color:var(--danger)}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);padding:12px 24px;border-radius:8px;font-size:13px;color:#fff;z-index:999;transition:transform .3s;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
.detail-item{display:flex;flex-direction:column;gap:2px}
.detail-item .label{font-size:11px;color:var(--text3);font-weight:500}
.detail-item .value{font-size:14px;color:var(--text);line-height:1.5}
.detail-full{grid-column:1/-1}
@media(max-width:1100px){.stat-group{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(max-width:768px){.topbar{padding:0 14px}.stats-row{padding:12px 14px;gap:10px}.stat-group{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px}.content{padding:0 14px 14px}.form-grid{grid-template-columns:1fr}.table-wrap{overflow-x:auto}table{min-width:800px}.stat-card.stat-wide{flex-wrap:wrap}.stat-wide .stat-meta{margin-left:0;width:100%;border-top:1px solid var(--border);padding-top:8px;margin-top:8px}.stat-meta>span:first-child{padding-left:0;border-left:none}}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
</style>
</head>
<body>

<!-- Login -->
<div class="login-page" id="loginPage">
  <div class="login-card">
    <div class="login-icon">👥</div>
    <h1>荷茗商贸 · 亚马逊员工档案</h1>
    <p class="subtitle">跨境电商人员归类系统</p>
    <label>输入共享密码进入</label>
    <input type="password" id="loginPwd" placeholder="请输入密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">进入系统</button>
  </div>
</div>

<!-- App -->
<div class="app" id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-sm">👥</div>
      <h1>荷茗商贸 · 亚马逊员工档案</h1>
    </div>
    <div class="topbar-right">
      <span class="user-name" id="loginUser"></span>
      <button class="btn btn-sm btn-outline" onclick="exportData()">📥 导出</button>
      <button class="btn btn-sm btn-outline" onclick="logout()">退出</button>
    </div>
  </div>
  <div class="stats-row" id="statsRow"></div>
  <div class="content">
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="搜索姓名、职位、部门...">
      </div>
      <select id="deptFilter"><option value="">全部部门</option></select>
      <button class="btn btn-outline filter-toggle" onclick="toggleFilter()">🔽 筛选 <span class="filter-count" id="filterCount"></span></button>
      <button class="btn btn-outline" onclick="toggleDeptPanel()">📁 管理部门</button>
      <button class="btn btn-primary" onclick="openAddModal()">+ 添加员工</button>
    </div>
    <div class="filter-panel" id="filterPanel">
      <div class="filter-row">
        <div class="fg"><label>部门</label><select id="filt_dept"><option value="">全部</option></select></div>
        <div class="fg"><label>职位</label><select id="filt_position"><option value="">全部</option></select></div>
        <div class="fg"><label>性别</label><select id="filt_gender"><option value="">全部</option><option value="男">男</option><option value="女">女</option></select></div>
        <div class="fg"><label>年龄范围</label><div class="filter-range"><input type="number" id="filt_age_min" placeholder="最小" min="0" max="100"> <span>—</span> <input type="number" id="filt_age_max" placeholder="最大" min="0" max="100"></div></div>
        <div class="fg"><label>入职时间</label><div class="filter-range"><input type="month" id="filt_hire_from"> <span>—</span> <input type="month" id="filt_hire_to"></div></div>
        <div class="fg"><label>员工类型</label><select id="filt_emp_type"><option value="">全部</option><option value="已转正">已转正</option><option value="未转正">未转正</option><option value="已离职">已离职</option><option value="已淘汰">已淘汰</option></select></div>
        <div class="filter-actions"><span class="filter-result" id="filterResult"></span><button class="btn btn-sm btn-primary" onclick="applyFilters()">筛选</button><button class="btn btn-sm" onclick="resetFilters()">重置</button></div>
      </div>
    </div>
    <div class="filter-panel" id="deptPanel">
      <div class="filter-row">
        <div class="fg" style="min-width:160px">
          <label>部名称</label>
          <input id="newPartInput" placeholder="如：运营部" onkeydown="if(event.key==='Enter')addDeptEntry()">
        </div>
        <div class="fg" style="min-width:160px">
          <label>组名称（可留空，只建部）</label>
          <div style="display:flex;gap:6px">
            <input id="newGroupInput" placeholder="如：晚柠组" style="flex:1" onkeydown="if(event.key==='Enter')addDeptEntry()">
            <button class="btn btn-sm btn-primary" onclick="addDeptEntry()">添加</button>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text3);align-self:flex-end;padding-bottom:8px">员工部门将保存为「部-组」</div>
      </div>
      <div id="deptTagList" style="margin-top:10px"></div>
    </div>
    <div class="table-wrap">
      <div class="table-hdr"><h3>员工列表</h3><span style="font-size:12px;color:var(--text3)" id="listCount"></span></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr>
            <th>姓名</th><th>性别</th><th>部门</th><th>职位</th><th>类型</th><th>出生年月</th><th class="sortable-th" id="ageSortTh" onclick="toggleAgeSort()" title="点击排序">年龄 <span class="sort-icon" id="ageSortIcon">⇅</span></th>
            <th class="sortable-th" id="hireSortTh" onclick="toggleHireSort()" title="点击排序">入职时间 <span class="sort-icon" id="hireSortIcon">⇅</span></th><th>上一份工作</th><th>备注</th><th>操作</th>
          </tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="table-footer" id="tableFooter"></div>
    </div>
  </div>
</div>

<!-- Form Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <div class="modal-header"><h2 id="formTitle">添加员工</h2><button class="modal-close" onclick="closeFormModal()">&times;</button></div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="form-group"><label class="req">姓名</label><input id="f_name" placeholder="员工姓名"></div>
        <div class="form-group"><label>性别</label><select id="f_gender"><option value="">请选择</option><option value="男">男</option><option value="女">女</option></select></div>
        <div class="form-group"><label class="req">部</label><select id="f_dept_part" onchange="onFormPartChange()"><option value="">请选择部</option></select></div>
        <div class="form-group"><label>组</label><select id="f_dept_group"><option value="">请选择组</option></select></div>
        <div class="form-group"><label>职位</label><input id="f_position" placeholder="如：产品经理"></div>
        <div class="form-group"><label>出生年月</label><input type="month" id="f_birth_date"></div>
        <div class="form-group"><label>入职时间</label><input type="month" id="f_hire_date"></div>
        <div class="form-group full"><label>优点</label><textarea id="f_strengths" rows="2" placeholder="员工的优点和长处"></textarea></div>
        <div class="form-group full"><label>缺点</label><textarea id="f_weaknesses" rows="2" placeholder="员工的不足和改进空间"></textarea></div>
        <div class="form-group"><label>上一份工作</label><input id="f_previous_job" placeholder="上一份工作/公司"></div>
        <div class="form-group"><label>性格</label><input id="f_personality" placeholder="如：内向、外向、细心等"></div>
        <div class="form-group"><label>员工类型</label><select id="f_employment_type"><option value="">请选择</option><option value="已转正">已转正</option><option value="未转正">未转正</option><option value="已离职">已离职</option><option value="已淘汰">已淘汰</option></select></div>
        <div class="form-group full"><label>备注</label><textarea id="f_remarks" rows="2" placeholder="其他需要记录的信息"></textarea></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeFormModal()">取消</button>
      <button class="btn btn-primary" id="saveBtn" onclick="saveEmployee()">保存</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header"><h2 id="detailTitle">员工详情</h2><button class="modal-close" onclick="closeDetailModal()">&times;</button></div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer"><button class="btn" onclick="closeDetailModal()">关闭</button><button class="btn btn-primary" id="detailEditBtn" onclick="editFromDetail()">编辑</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ====== CONFIG ======
const GITHUB_USER = 'hdgzdzjkh2-afk';
const GITHUB_REPO = 'hemingshangmao-employee';
const GITHUB_TOKEN = ['ghp','_Bpb7TenvR','Jh0u9f7C6eHxqI7D','IwgsJ0qaxzD'].join('');
const BRANCH = 'master';
const DATA_PATH = 'data/employees.json';
const CONFIG_PATH = 'data/config.json';
const DEPTS_PATH = 'data/departments.json';

const RAW_URL = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${BRANCH}`;
const API_URL = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents`;

// ====== STATE ======
let employees = [];
let config = { password: 'HMSMAMZ' };
let employeesSha = '';
let departments = [];
let deptsSha = '';
let loggedIn = false;
let editingId = null;
let detailId = null;
let hireSort = 'desc';
let ageSort = null;
let filters = { dept:'', position:'', gender:'', ageMin:'', ageMax:'', hireFrom:'', hireTo:'', empType:'', activeOnly:true };

function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show '+type;
  setTimeout(()=>t.className='toast', 2500);
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s||'';
  return d.innerHTML;
}

// ====== GITHUB DATA ======
async function ghGet(path) {
  const res = await fetch(`${RAW_URL}/${path}?t=${Date.now()}`);
  if (!res.ok) throw new Error('读取数据失败');
  return res.json();
}

async function ghPut(path, content, sha, msg) {
  const body = { message: msg, content: btoa(unescape(encodeURIComponent(JSON.stringify(content,null,2)))), branch: BRANCH, sha };
  const res = await fetch(`${API_URL}/${path}`, {
    method: 'PUT',
    headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const e = await res.json().catch(()=>({}));
    throw new Error(e.message || '保存失败');
  }
  const d = await res.json();
  return d.content.sha;
}

// ====== DEPARTMENTS ======
async function loadDepts() {
  try {
    const res = await fetch(`${API_URL}/${DEPTS_PATH}?ref=${BRANCH}`, {
      headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}` }
    });
    if (!res.ok) { departments = []; deptsSha = ''; return; }
    const info = await res.json();
    deptsSha = info.sha;
    const raw = JSON.parse(decodeURIComponent(escape(atob(info.content))));
    // 兼容旧格式（字符串数组）与新格式 [{name, groups}]
    departments = (Array.isArray(raw) ? raw : [])
      .map(d => typeof d === 'string' ? { name: d, groups: [] } : d)
      .filter(d => d && d.name);
  } catch(e) { departments = []; }
}

async function saveDepts() {
  try {
    const body = { message: '更新部门列表', content: btoa(unescape(encodeURIComponent(JSON.stringify(departments,null,2)))), branch: BRANCH };
    if (deptsSha) body.sha = deptsSha;
    const res = await fetch(`${API_URL}/${DEPTS_PATH}`, {
      method: 'PUT',
      headers: { 'Authorization': `Bearer ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error('保存部门失败');
    const d = await res.json();
    deptsSha = d.content.sha;
  } catch(e) { toast('保存部门失败: '+e.message, 'error'); throw e; }
}

async function addDeptEntry() {
  const part = document.getElementById('newPartInput').value.trim();
  const grp = document.getElementById('newGroupInput').value.trim();
  if (!part) return toast('请输入部名称', 'error');
  let d = departments.find(x => x.name === part);
  if (!d) {
    d = { name: part, groups: [] };
    departments.push(d);
    departments.sort((a,b) => a.name.localeCompare(b.name, 'zh'));
  }
  if (grp) {
    if (d.groups.includes(grp)) return toast('「' + part + '」下已有「' + grp + '」', 'error');
    d.groups.push(grp);
    d.groups.sort((a,b) => a.localeCompare(b, 'zh'));
  }
  await saveDepts();
  document.getElementById('newPartInput').value = '';
  document.getElementById('newGroupInput').value = '';
  toast(grp ? '已添加 ' + part + ' - ' + grp : '已添加 ' + part, 'success');
  render();
}

async function removeDeptGroup(partName, groupName) {
  const full = partName + '-' + groupName;
  const usedBy = employees.filter(e => e.department === full || e.department === groupName);
  let confirmMsg = `确定要删除「${full}」吗？`;
  if (usedBy.length > 0) {
    confirmMsg += `\n注意：该组被 ${usedBy.length} 名员工使用，删除将清空这些员工的部门字段。`;
  }
  if (!confirm(confirmMsg)) return;
  const d = departments.find(x => x.name === partName);
  if (d) d.groups = d.groups.filter(g => g !== groupName);
  await saveDepts();
  if (usedBy.length > 0) {
    employees.forEach(e => { if (e.department === full || e.department === groupName) e.department = ''; });
    await saveData('清空已删除小组的员工部门字段');
  }
  toast('小组已删除', 'success');
  render();
}

async function removeDeptPart(partName) {
  const d = departments.find(x => x.name === partName);
  const groups = d ? d.groups : [];
  const usedBy = employees.filter(e => e.department === partName || (e.department||'').startsWith(partName + '-') || groups.includes(e.department));
  let confirmMsg = `确定要删除部「${partName}」吗？` + (groups.length ? `\n其下的 ${groups.length} 个小组将一并删除。` : '');
  if (usedBy.length > 0) {
    confirmMsg += `\n注意：该部被 ${usedBy.length} 名员工使用，删除将清空这些员工的部门字段。`;
  }
  if (!confirm(confirmMsg)) return;
  departments = departments.filter(x => x.name !== partName);
  await saveDepts();
  if (usedBy.length > 0) {
    employees.forEach(e => {
      if (e.department === partName || (e.department||'').startsWith(partName + '-') || groups.includes(e.department)) e.department = '';
    });
    await saveData('清空已删除部的员工部门字段');
  }
  toast('部已删除', 'success');
  render();
}

function getDeptTree() {
  // departments: [{name, groups}]；legacy = 员工档案中存在、但不属于任何已管理部/组的值
  const tree = departments.map(d => ({ name: d.name, groups: [...(d.groups||[])] }));
  const legacy = new Set();
  employees.map(e=>e.department).filter(Boolean).forEach(v => {
    const matched = tree.some(d => v === d.name || d.groups.includes(v) || v.startsWith(d.name + '-'));
    if (!matched) legacy.add(v);
  });
  return { tree, legacy: [...legacy].sort() };
}

function getAllDepts() {
  // 所有可选部门完整值：部本身、部-组、员工档案中的遗留值
  const { tree, legacy } = getDeptTree();
  const vals = [];
  tree.forEach(d => { vals.push(d.name); d.groups.forEach(g => vals.push(d.name + '-' + g)); });
  return [...new Set([...vals, ...legacy])].sort();
}

// ====== RENDER ======
function typeClass(t) {
  if (t==='已转正') return 'regular';
  if (t==='未转正') return 'probation';
  if (t==='已离职') return 'resigned';
  if (t==='已淘汰') return 'terminated';
  return '';
}

function calcAge(birth) {
  if (!birth) return '';
  const b = new Date(birth);
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age + ' 岁';
}

function calcAgeRaw(birth) {
  if (!birth) return NaN;
  const b = new Date(birth);
  const now = new Date();
  let age = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && now.getDate() < b.getDate())) age--;
  return age;
}

function fmtHireDate(date) {
  if (!date) return '';
  const d = new Date(date);
  if (isNaN(d.getTime())) return date;
  return (d.getFullYear()) + '-' + String(d.getMonth()+1).padStart(2,'0');
}

  if (ageSort === 'desc') list.sort((a,b) => (calcAgeRaw(b.birth_date)||-1) - (calcAgeRaw(a.birth_date)||-1));

  if (position) list = list.filter(e => e.position === position);

  if (filters.ageMax) list = list.filter(e => { const a = calcAgeRaw(e.birth_date); return !isNaN(a) && a <= parseInt(filters.ageMax); });

  const statList = (() => {
    let l = [...employees];

    if (filters.ageMax) l = l.filter(e => { const a = calcAgeRaw(e.birth_date); return !isNaN(a) && a <= parseInt(filters.ageMax); });

  const male = activeList.filter(e=>e.gender==='男').length;
  const female = activeList.filter(e=>e.gender==='女').length;

    <div class="stat-card ${filters.gender==='男'?'stat-active':''}" onclick="filterByStat('male')" title="点击只看在职男生"><div class="stat-icon" style="background:#dbeafe;color:#2563eb">♂</div><div><div class="stat-num">${male}</div><div class="stat-label">男生<span class="stat-pct">${pct(male)}</span></div></div></div>
    <div class="stat-card ${filters.gender==='女'?'stat-active':''}" onclick="filterByStat('female')" title="点击只看在职女生"><div class="stat-icon" style="background:#fce7f3;color:#db2777">♀</div><div><div class="stat-num">${female}</div><div class="stat-label">女生<span class="stat-pct">${pct(female)}</span></div></div></div>

    </div>

    <div class="stat-group" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <div class="stat-card stat-wide ${filters.empType==='已离职'?'stat-active':''}" onclick="filterByStat('resigned')" title="点击只看已离职"><div class="stat-icon" style="background:#f1f5f9;color:#64748b">🚪</div><div><div class="stat-num">${resigned}</div><div class="stat-label">已离职</div></div><div class="stat-meta">${grpMeta(resignedList)}</div></div>

function buildDeptFilterOptions(selected) {
  const { tree, legacy } = getDeptTree();
  let html = '';
  tree.forEach(d => {
    if (d.groups.length === 0) {
      html += `<option value="${escHtml(d.name)}" ${d.name===selected?'selected':''}>${escHtml(d.name)}</option>`;
      return;
    }
    html += `<optgroup label="${escHtml(d.name)}">`;
    html += `<option value="${escHtml(d.name)}" ${d.name===selected?'selected':''}>${escHtml(d.name)}（整部）</option>`;
    d.groups.forEach(g => {
      const v = d.name + '-' + g;
      html += `<option value="${escHtml(v)}" ${v===selected?'selected':''}>${escHtml(g)}</option>`;
    });
    html += '</optgroup>';
  });
  legacy.forEach(v => {
    html += `<option value="${escHtml(v)}" ${v===selected?'selected':''}>${escHtml(v)}（旧）</option>`;
  });
  return html;
}

        </span>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  });

    html += `<div style="margin-bottom:6px;font-size:11px;color:var(--text3)">以下为历史数据（未归类到部），编辑员工时重新选择即可归类：</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-left:8px">`;
    legacy.forEach(v => {

      html += `<span style="display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;color:#64748b;padding:4px 12px;border-radius:20px;font-size:12px;">
        ${escHtml(v)}${count > 0 ? `<span style="opacity:.7;font-size:10px">(${count})</span>` : ''}
        <button onclick="removeLegacyDept('${escHtml(v)}')" style="background:none;border:none;cursor:pointer;color:var(--text3);font-size:14px;line-height:1;padding:0" title="删除">×</button>
      </span>`;
    });
    html += `</div>`;
  }
  el.innerHTML = html;
}

async function removeLegacyDept(name) {
  const usedBy = employees.filter(e => e.department === name);
  let confirmMsg = `确定要从列表中移除「${name}」吗？`;
  if (usedBy.length > 0) {
    confirmMsg += `\n注意：该值被 ${usedBy.length} 名员工使用，删除将清空这些员工的部门字段。`;
  }
  if (!confirm(confirmMsg)) return;
  if (usedBy.length > 0) {
    employees.forEach(e => { if (e.department === name) e.department = ''; });
    await saveData('清空已删除部门的员工部门字段');
  }
  toast('已移除', 'success');
  render();
}

// ====== FILTERS ======
function toggleFilter() { document.getElementById('filterPanel').classList.toggle('open'); }
function toggleDeptPanel() { document.getElementById('deptPanel').classList.toggle('open'); renderDeptTags(); }
const FILTER_KEYS = ['dept','position','gender','ageMin','ageMax','hireFrom','hireTo','empType'];
function updateFilterBadge() {
  const active = FILTER_KEYS.filter(k=>filters[k]).length;
  const badge = document.getElementById('filterCount');
  if (badge) { if (active) { badge.textContent = active; badge.classList.add('active'); } else badge.classList.remove('active'); }
}
function applyFilters() {
  filters.dept = document.getElementById('filt_dept').value;
  filters.position = document.getElementById('filt_position').value;
  filters.gender = document.getElementById('filt_gender').value;
  filters.ageMin = document.getElementById('filt_age_min').value;
  filters.ageMax = document.getElementById('filt_age_max').value;
  filters.hireFrom = document.getElementById('filt_hire_from').value;
  filters.hireTo = document.getElementById('filt_hire_to').value;
  filters.empType = document.getElementById('filt_emp_type').value;

}
function resetFilters() {
  filters = { dept:'', position:'', gender:'', ageMin:'', ageMax:'', hireFrom:'', hireTo:'', empType:'', activeOnly:true };
  ['filt_dept','filt_position','filt_gender','filt_age_min','filt_age_max','filt_hire_from','filt_hire_to','filt_emp_type'].forEach(id=>document.getElementById(id).value='');
  updateFilterBadge();
  render();
}

// ====== STAT CARD FILTER ======
function filterByStat(type) {
  const prev = { gender: filters.gender, empType: filters.empType };
  if (type === 'all') {
    filters.gender = ''; filters.empType = ''; filters.activeOnly = true;
  } else if (type === 'male') {
    filters.gender = (filters.gender === '男') ? '' : '男';
    filters.empType = ''; filters.activeOnly = true;
  } else if (type === 'female') {
    filters.gender = (filters.gender === '女') ? '' : '女';
    filters.empType = ''; filters.activeOnly = true;
  } else if (type === 'regular') {
    filters.empType = (filters.empType === '已转正') ? '' : '已转正';
    filters.gender = ''; filters.activeOnly = true;
  } else if (type === 'probation') {
    filters.empType = (filters.empType === '未转正') ? '' : '未转正';
    filters.gender = ''; filters.activeOnly = true;
  } else if (type === 'resigned') {
    filters.empType = (filters.empType === '已离职') ? '' : '已离职';
    filters.gender = ''; filters.activeOnly = false;
  } else if (type === 'terminated') {
    filters.empType = (filters.empType === '已淘汰') ? '' : '已淘汰';
    filters.gender = ''; filters.activeOnly = false;
  }
  document.getElementById('filt_gender').value = filters.gender;
  document.getElementById('filt_emp_type').value = filters.empType;
  updateFilterBadge();
  render();
}

  buildFormDeptOptions('', '');
}

// ====== DEPT FORM (部-组) ======
function buildFormDeptOptions(selectedPart, selectedGroup) {
  const { tree, legacy } = getDeptTree();
  const partSel = document.getElementById('f_dept_part');
  let opts = '<option value="">请选择部</option>';
  tree.forEach(d => { opts += `<option value="${escHtml(d.name)}" ${d.name===selectedPart?'selected':''}>${escHtml(d.name)}</option>`; });
  if (selectedPart && !tree.some(d => d.name === selectedPart)) {
    opts += `<option value="${escHtml(selectedPart)}" selected>${escHtml(selectedPart)}（旧）</option>`;
  }
  partSel.innerHTML = opts;
  const gSel = document.getElementById('f_dept_group');
  let gopts = '<option value="">请选择组</option>';
  const d = tree.find(x => x.name === selectedPart);
  if (d) d.groups.forEach(g => { gopts += `<option value="${escHtml(g)}" ${g===selectedGroup?'selected':''}>${escHtml(g)}</option>`; });
  if (selectedGroup && (!d || !d.groups.includes(selectedGroup))) {
    gopts += `<option value="${escHtml(selectedGroup)}" selected>${escHtml(selectedGroup)}${d ? '' : '（旧）'}</option>`;
  }
  gSel.innerHTML = gopts;
}
function onFormPartChange() { buildFormDeptOptions(document.getElementById('f_dept_part').value, ''); }
function setFormDept(dep) {
  if (!dep) return buildFormDeptOptions('', '');
  const pi = dep.indexOf('-');
  const part = pi > 0 ? dep.slice(0, pi) : '';
  const grp = pi > 0 ? dep.slice(pi + 1) : dep;
  buildFormDeptOptions(part, grp);
}
function getFormDept() {
  const part = document.getElementById('f_dept_part').value;
  const grp = document.getElementById('f_dept_group').value;
  if (part && grp) return part + '-' + grp;
  if (part) return part;
  if (grp) return grp;
  return '';
}
function closeFormModal() { document.getElementById('formModal').classList.remove('active'); editingId = null; }

async function saveEmployee() {
  const body = {
    id: editingId || 'e_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    name: document.getElementById('f_name').value.trim(),
    gender: document.getElementById('f_gender').value,
    department: getFormDept(),
    position: document.getElementById('f_position').value.trim(),
    birth_date: document.getElementById('f_birth_date').value,
    hire_date: document.getElementById('f_hire_date').value,
    strengths: document.getElementById('f_strengths').value.trim(),
    weaknesses: document.getElementById('f_weaknesses').value.trim(),
    previous_job: document.getElementById('f_previous_job').value.trim(),
    personality: document.getElementById('f_personality').value.trim(),
    remarks: document.getElementById('f_remarks').value.trim(),
    employment_type: document.getElementById('f_employment_type').value,
    created_by: '系统用户',
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString()
  };
  if (!body.name) return toast('请输入姓名', 'error');
  if (!body.department) return toast('请输入部门', 'error');

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '保存中...';
  try {
    if (editingId) {
      const idx = employees.findIndex(e=>e.id===editingId);
      if (idx >= 0) {
        body.created_by = employees[idx].created_by;
        body.created_at = employees[idx].created_at;
        employees[idx] = body;
      }
    } else {
      employees.push(body);
    }
    await saveData(editingId ? `更新「${body.name}」` : `添加「${body.name}」`);
    toast(editingId ? '员工信息已更新' : '员工已添加');
    closeFormModal();
    render();
  } catch(e) {
    toast('保存失败: '+e.message, 'error');
    await loadData(); // Reload to restore state
  }
  btn.disabled = false; btn.textContent = '保存';
}

async function deleteEmployee(id) {
  if (!confirm('确定删除该员工档案吗？')) return;
  const e = employees.find(e=>e.id===id);
  employees = employees.filter(e=>e.id!==id);
  try {
    await saveData(`删除「${e.name}」`);
    toast(`已删除「${e.name}」的档案`);
    render();
  } catch(err) {
    toast('删除失败: '+err.message, 'error');
    await loadData();
  }
}

// ====== EXPORT ======
function exportData() {
  const csv = [
    ['姓名','性别','部门','职位','员工类型','出生年月','年龄','入职时间','优点','缺点','上一份工作','备注','录入人','录入时间'].join(','),
    ...employees.map(e => [
      `"${e.name}"`,`"${e.gender}"`,`"${e.department}"`,`"${e.position}"`,`"${e.employment_type||''}"`,`"${e.birth_date}"`,
      `"${calcAge(e.birth_date)}"`,`"${fmtHireDate(e.hire_date)}"`,`"${e.strengths}"`,`"${e.weaknesses}"`,`"${e.previous_job}"`,
      `"${e.remarks||''}"`,`"${e.created_by}"`,`"${e.created_at}"`
    ].join(','))
  ].join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `员工档案_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('导出成功');
}
